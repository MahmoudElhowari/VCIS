<!DOCTYPE html>
<html lang="en-CA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage Reviews | View Canada Immigration Services</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1f2d42">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,700&amp;family=Jost:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container site-header__inner">
      <a href="/" class="brand">
        <img class="brand__logo" src="/images/logo-mark.png" alt="" width="520" height="302">
        <span class="brand__text"><span class="brand__name">View Canada</span><span class="brand__tag">Review manager</span></span>
      </a>
      <button type="button" class="btn btn--outline" id="sign-out" hidden>Sign out</button>
    </div>
  </header>

  <main id="main" class="section">
    <div class="container admin">

      <section id="login" class="form-card admin-login" aria-labelledby="login-title">
        <h1 id="login-title" style="font-size:2rem">Manage client reviews</h1>
        <p>Enter the admin password to approve or remove reviews.</p>
        <form id="login-form">
          <div class="field">
            <label for="password">Admin password</label>
            <input type="password" id="password" autocomplete="current-password" required style="width:100%;min-height:50px;padding:12px 14px;border:1.5px solid #c9ced6;border-radius:6px">
          </div>
          <button type="submit" class="btn btn--dark btn--block">Sign in</button>
          <p class="form-status" id="login-status" role="status"></p>
        </form>
      </section>

      <section id="panel" hidden aria-labelledby="panel-title">
        <div class="admin-head">
          <h1 id="panel-title" style="font-size:2.2rem">Client reviews</h1>
          <div class="admin-tabs" role="tablist" aria-label="Filter reviews">
            <button type="button" role="tab" class="admin-tab" data-filter="pending" aria-selected="true">Waiting for approval <span data-count="pending"></span></button>
            <button type="button" role="tab" class="admin-tab" data-filter="approved" aria-selected="false">Published <span data-count="approved"></span></button>
          </div>
        </div>
        <p class="form-status" id="panel-status" role="status"></p>
        <div id="admin-list" class="admin-list"></div>
      </section>

    </div>
  </main>

  <script src="/js/review-admin.js" defer></script>
</body>
</html>
